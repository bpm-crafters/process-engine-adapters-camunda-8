# Local demonstration only: API authentication is disabled and UI/database credentials are public.
services:
  camunda-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: camunda_secondary
      POSTGRES_USER: camunda
      POSTGRES_PASSWORD: camunda
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U camunda -d camunda_secondary"]
      interval: 5s
      timeout: 5s
      retries: 20
  camunda:
    image: camunda/camunda:8.10.7
    depends_on:
      camunda-postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:26500:26500"
      - "127.0.0.1:8088:8080"
    environment:
      SPRING_PROFILES_ACTIVE: broker,operate,tasklist,admin,consolidated-auth,security
      CAMUNDA_SECURITY_AUTHENTICATION_METHOD: basic
      CAMUNDA_SECURITY_AUTHENTICATION_UNPROTECTEDAPI: "true"
      CAMUNDA_SECURITY_AUTHORIZATIONS_ENABLED: "false"
      CAMUNDA_DATA_SECONDARYSTORAGE_TYPE: rdbms
      CAMUNDA_DATA_SECONDARYSTORAGE_RDBMS_URL: jdbc:postgresql://camunda-postgres:5432/camunda_secondary
      CAMUNDA_DATA_SECONDARYSTORAGE_RDBMS_USERNAME: camunda
      CAMUNDA_DATA_SECONDARYSTORAGE_RDBMS_PASSWORD: camunda
      CAMUNDA_SECURITY_INITIALIZATION_USERS_0_USERNAME: demo
      CAMUNDA_SECURITY_INITIALIZATION_USERS_0_PASSWORD: demo
      CAMUNDA_SECURITY_INITIALIZATION_USERS_0_NAME: demo
      CAMUNDA_SECURITY_INITIALIZATION_USERS_0_EMAIL: demo@example.invalid
      CAMUNDA_SECURITY_INITIALIZATION_DEFAULTROLES_ADMIN_USERS_0: demo
