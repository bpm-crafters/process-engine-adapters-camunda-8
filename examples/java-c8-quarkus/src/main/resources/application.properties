quarkus.http.port=18082

dev.bpm-crafters.process-api.adapter.c8.enabled=true
dev.bpm-crafters.process-api.adapter.c8.service-tasks.delivery-strategy=SUBSCRIPTION
dev.bpm-crafters.process-api.adapter.c8.service-tasks.worker-id=example-worker
dev.bpm-crafters.process-api.adapter.c8.user-tasks.delivery-strategy=SCHEDULED
dev.bpm-crafters.process-api.adapter.c8.user-tasks.schedule-delivery-fixed-rate-in-seconds=5

quarkus.log.category."dev.bpmcrafters".level=DEBUG

# In dev and test mode no broker address is configured, so the quarkus-camunda dev services start
# a Camunda container automatically.

# Profile for Camunda 8 Run / self-managed with disabled security, see
# examples/java-c8/docker-compose.yaml. Note: quarkus-camunda supports OAuth and SaaS credentials,
# but no basic auth (quarkus.camunda.client.oauth.* / quarkus.camunda.client.cloud.*).
%c8run.quarkus.camunda.devservices.enabled=false
%c8run.quarkus.camunda.client.broker.gateway-address=http://localhost:26500
%c8run.quarkus.camunda.client.broker.rest-address=http://localhost:8088
