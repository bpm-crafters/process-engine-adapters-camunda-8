quarkus:
  http:
    port: 18083
    host: "127.0.0.1"
    test-port: 0
  swagger-ui:
    always-include: true
  smallrye-openapi:
    info-title: Camunda 8 Process Engine API Quarkus example
  process-engine-api:
    c8:
      enabled: true
      service-tasks:
        delivery-strategy: SUBSCRIPTION
        worker-id: example-worker
      user-tasks:
        delivery-strategy: LISTENER
        schedule-delivery-fixed-rate-in-seconds: 5
        listener:
          auto-register-global-listener: true
          preload-existing-tasks: true
  camunda:
    resources:
      enabled: false
    devservices:
      enabled: false

"%run":
  quarkus:
    camunda:
      client:
        broker:
          gateway-address: "${CAMUNDA_GRPC_ADDRESS:http://localhost:26500}"
          rest-address: "${CAMUNDA_REST_ADDRESS:http://localhost:8088}"

"%saas":
  quarkus:
    camunda:
      client:
        broker:
          gateway-address: "${CAMUNDA_GRPC_ADDRESS}"
          rest-address: "${CAMUNDA_REST_ADDRESS}"
        oauth:
          client-id: "${ZEEBE_CLIENT_ID}"
          client-secret: "${ZEEBE_CLIENT_SECRET}"
          auth-url: "${CAMUNDA_OAUTH_URL:https://login.cloud.camunda.io/oauth/token}"
          token-audience: "${CAMUNDA_TOKEN_AUDIENCE:zeebe.camunda.io}"
