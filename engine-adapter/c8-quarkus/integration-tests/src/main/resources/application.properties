quarkus.process-engine-api.c8.enabled=true
quarkus.process-engine-api.c8.service-tasks.delivery-strategy=SUBSCRIPTION
quarkus.process-engine-api.c8.service-tasks.worker-id=quarkus-integration-tests
quarkus.process-engine-api.c8.service-tasks.retry-timeout-in-seconds=1
quarkus.process-engine-api.c8.user-tasks.delivery-strategy=SCHEDULED
quarkus.process-engine-api.c8.user-tasks.schedule-delivery-fixed-rate-in-seconds=1
quarkus.process-engine-api.c8.user-tasks.listener.auto-register-global-listener=true
quarkus.process-engine-api.c8.user-tasks.listener.preload-existing-tasks=true
quarkus.native.resources.includes=bpmn/**,decision/**,example/**
